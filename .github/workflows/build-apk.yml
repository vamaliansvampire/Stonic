name: Build and Publish Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          echo "--- Java Version ---"
          java -version
          echo "--- JAVA_HOME ---"
          echo "JAVA_HOME=$JAVA_HOME"
          if [ -z "$JAVA_HOME" ]; then
            echo "Error: JAVA_HOME is not set."
            exit 1
          fi
          JAVA_VER_STRING=$(java -version 2>&1 | head -n 1)
          echo "Detected Java version string: $JAVA_VER_STRING"
          MAJOR_VERSION=$(echo "$JAVA_VER_STRING" | sed -E 's/.*version "([0-9]+).*/\1/')
          if ! [[ "$MAJOR_VERSION" =~ ^[0-9]+$ ]]; then
            echo "Error: Could not detect active Java major version."
            exit 1
          fi
          echo "Detected active Java major version: $MAJOR_VERSION"
          if [ "$MAJOR_VERSION" -lt 17 ]; then
            echo "Error: Active Java major version must be 17 or higher (detected: $MAJOR_VERSION)."
            exit 1
          fi
          echo "Java environment verified successfully: Java $MAJOR_VERSION (>= 17)."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          if [ ! -f "./debug.keystore" ]; then
            echo "debug.keystore not found. Generating temporary debug keystore..."
            keytool -genkeypair -v \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          else
            echo "Existing debug.keystore detected."
          fi
          if [ ! -f "./debug.keystore" ]; then
            echo "Error: ./debug.keystore could not be verified."
            exit 1
          fi
          echo "Temporary debug keystore verified."

      - name: Build the debug APK
        run: |
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK
        run: |
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$EXPECTED_APK" ]; then
            echo "Error: Expected APK not found at $EXPECTED_APK"
            echo "Discovered APKs in app/build/outputs/apk:"
            if [ -d "app/build/outputs/apk" ]; then
              find app/build/outputs/apk -type f -name "*.apk"
            else
              echo "Directory app/build/outputs/apk does not exist."
            fi
            exit 1
          fi
          if [ ! -s "$EXPECTED_APK" ]; then
            echo "Error: APK file is empty: $EXPECTED_APK"
            exit 1
          fi
          if [[ "$EXPECTED_APK" != *.apk ]]; then
            echo "Error: APK file does not have .apk extension: $EXPECTED_APK"
            exit 1
          fi
          echo "Verified APK at $EXPECTED_APK (Size: $(stat -c%s "$EXPECTED_APK") bytes)"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          ASSET_DIR="${RUNNER_TEMP}/apk-release-assets"
          mkdir -p "$ASSET_DIR"
          RAW_REPO_NAME=$(basename "${{ github.repository }}")
          SAFE_REPO_NAME=$(echo "$RAW_REPO_NAME" | sed 's/[^a-zA-Z0-9._-]/-/g' | sed 's/--*/-/g' | sed 's/^-//' | sed 's/-$//')
          if [ -z "$SAFE_REPO_NAME" ]; then
            SAFE_REPO_NAME="android-app"
          fi
          RELEASE_FILENAME="${SAFE_REPO_NAME}-debug-build-${{ github.run_number }}.apk"
          DEST_PATH="${ASSET_DIR}/${RELEASE_FILENAME}"
          cp "app/build/outputs/apk/debug/app-debug.apk" "$DEST_PATH"
          if [ ! -s "$DEST_PATH" ]; then
            echo "Error: Copied release asset is missing or empty at $DEST_PATH"
            exit 1
          fi
          echo "Release asset prepared: $DEST_PATH"
          echo "asset_path=${DEST_PATH}" >> "$GITHUB_OUTPUT"
          echo "asset_name=${RELEASE_FILENAME}" >> "$GITHUB_OUTPUT"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "--- GitHub CLI Version ---"
          gh --version
          ASSET_PATH="${{ steps.prepare_asset.outputs.asset_path }}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"
          if [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ] || [[ "$ASSET_PATH" != *.apk ]]; then
            echo "Error: Release asset validation failed: $ASSET_PATH"
            exit 1
          fi
          RELEASE_TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          RELEASE_TITLE="Debug APK Build #${{ github.run_number }}"
          RELEASE_NOTES=$(cat << 'EOF'
          ## Automated Debug APK Build

          This is an automatically generated debug APK built by GitHub Actions.

          - **GitHub Actions Run Number:** #${{ github.run_number }}
          - **Run Attempt:** ${{ github.run_attempt }}
          - **Source Commit SHA:** `${{ github.sha }}`
          - **Intended Audience:** Testing and QA evaluation
          - **Production Notice:** This APK is NOT a Google Play Store production release.
          - **Signing Details:** Signed exclusively with a temporary debug keystore.

          Download the APK directly from the **Assets** section below.
          EOF
          )

          echo "Creating GitHub Release with tag: $RELEASE_TAG and asset: $ASSET_PATH"
          gh release create "$RELEASE_TAG" "$ASSET_PATH" \
            --title "$RELEASE_TITLE" \
            --notes "$RELEASE_NOTES" \
            --target "${{ github.sha }}" \
            --latest

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"
          if [ "${{ steps.publish_release.outcome }}" = "success" ]; then
            echo "=== GitHub Release Published Successfully ==="
            gh release view "$RELEASE_TAG"
            RELEASE_URL=$(gh release view "$RELEASE_TAG" --json url -q .url || echo "https://github.com/${{ github.repository }}/releases/tag/${RELEASE_TAG}")
            echo "Release Tag: $RELEASE_TAG"
            echo "Release Title: Debug APK Build #${{ github.run_number }}"
            echo "Release URL: $RELEASE_URL"
            echo "APK Asset Name: $ASSET_NAME"
            {
              echo "## 🚀 Debug APK Build & Release Summary"
              echo ""
              echo "- **Release Status:** Published successfully"
              echo "- **Release Tag:** \`$RELEASE_TAG\`"
              echo "- **APK Filename:** \`$ASSET_NAME\`"
              echo "- **Direct Download URL:** [View GitHub Release]($RELEASE_URL)"
              echo ""
              echo "The debug APK can be downloaded directly from the **Assets** section of the release above on any Android device."
              echo ""
              echo "> **Backup:** The normal Actions artifact \`app-debug-apk\` also remains available in the run summary."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::GitHub Release publishing failed or was skipped."
            echo "APK Build Succeeded: app/build/outputs/apk/debug/app-debug.apk was built successfully."
            echo "The GitHub Actions artifact named 'app-debug-apk' remains available for download."
            {
              echo "## ⚠️ Debug APK Build Summary"
              echo ""
              echo "- **APK Build:** Succeeded"
              echo "- **Actions Artifact:** Uploaded successfully (\`app-debug-apk\`)"
              echo "- **Release Publishing:** Failed or encountered an error"
              echo ""
              echo "> **Note:** Although GitHub Release publishing encountered an issue, your debug APK was preserved as a workflow artifact. You can download \`app-debug-apk\` directly from this GitHub Actions run summary."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
